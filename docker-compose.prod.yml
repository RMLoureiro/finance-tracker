# Deploy no Dokploy (tipo "Compose"):
#   1. define POSTGRES_PASSWORD nas variáveis de ambiente do projeto
#   2. aponta o domínio para o serviço "app", porta 8080 (HTTPS pelo Traefik do Dokploy)
services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://finance:${POSTGRES_PASSWORD}@db:5432/finance?sslmode=disable
      COOKIE_SECURE: "true"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
